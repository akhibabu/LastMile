services:
  - type: web
    name: lastmile-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: FROM_EMAIL
        value: noreply@lastmile.local
      - key: FROM_NAME
        value: LastMile
      - key: RESEND_API_KEY
        sync: false
      - key: LOCATION_UPDATE_INTERVAL
        value: "30000"
      - key: LOCATION_STALE_THRESHOLD
        value: "300000"
      - key: NODE_ENV
        value: production
